<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Splash White Water Rafting</title>
    <meta name="description" content="Contact Splash White Water Rafting for general inquiries, reservation questions, or website suggestions. Find our address, phone, email, and send us a message.">
    <meta name="author" content="Hayford Wokporka">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Splash White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Splash White Water Rafting</h1>
            <p>123 Main River Street<br>Kolob, California<br>+1 999 999 9999<br>info@whitewater.com</p>
        </section>

        <div class="contact-layout">
            <div class="map">
                <iframe src="https://www.google.com/maps?q=Kolob,+California&output=embed" width="400" height="350" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Splash White Water Rafting location map"></iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" id="general" name="purpose" value="general-inquiry" checked> General Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation-question"> Reservation Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="website-suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" checked>
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee-1.webp" alt="Emma Johnson, Lead River Guide">
                    <figcaption>Employee Profile<br>Emma Johnson - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-2.jpg" alt="Michael Carter, Trip Manager">
                    <figcaption>Employee Profile<br>Michael Carter - Trip Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-3.avif" alt="Sarah Lee, Customer Service Coordinator">
                    <figcaption>Employee Profile<br>Sarah Lee - Customer Service Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Splash White Water Rafting | Hayford Wokporka</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
